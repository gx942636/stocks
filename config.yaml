# 中线低位筛选 / 回测配置 —— 在 PyCharm 中改这里后运行 main.py

start_date: "2026-09-01"
end_date: "2026-09-08"
mode: both   # screen | backtest | both

data:
  source: akshare          # akshare | tushare | csv
  cache_dir: data_cache
  tushare_token: ""        # source=tushare 时填写
  csv_dir: data_cache/csv  # source=csv 时读取目录
  max_stocks: 800           # 流通市值达标后按成交额从高到低截取
  request_pause: 0.12      # 拉单票日线间隔（秒）
  adjust: qfq              # 前复权
  vpn_split_domestic: true # VPN 下保留代理，仅让东方财富等国内行情域名直连

strategy:
  # 范围
  price_min: 2             # 只排除低于 2 元的极低价
  circ_mv_min_yi: 30       # 流通市值下限（亿），不设上限
  exclude_st: true
  exclude_kcb: true        # 科创板 688
  exclude_cyb: true        # 创业板 300 / 301

  # 基本面没有坏（当前截面，不是历史估值）
  pe_max: 150
  pb_max: 15

  # 相对低位与以前的成交关注度
  history_calendar_days: 400
  lookback_days: 250       # 近一年交易日
  drawdown_min: 30         # 自高点回撤至少（%）
  range_pos_max: 0.35      # 收盘在高低区间从低点算起的比例上限
  amount_window: 120
  amount_median_min_yi: 0.5  # 近 120 日成交额中位数至少（亿）

  # 回测持有（不作为入选条件）
  stop_loss_pct: 0.12
  take_profit_cap_pct: 0.25
  repair_ratio: 0.60
  hold_min_days: 20
  hold_max_days: 40
  max_positions: 5

backtest:
  initial_cash: 1000000
  equal_weight: true
